openapi: 3.0.1
info:
  title: Context Intelligence Manager API
  description: |
    Comprehensive API for managing conversation context, research documentation,
    decision matrices, and knowledge integration. Provides persistent context
    management across ChatGPT sessions for professional users.
  version: 2.0.0
  contact:
    name: Context Intelligence Support
    url: https://contextintelligence.example.com/support
    email: support@contextintelligence.example.com

servers:
  - url: https://contextintelligence.example.com/api/v2
    description: Production server

paths:
  /contexts:
    post:
      summary: Create a new context
      description: Creates a new conversation context with metadata and tags
      operationId: createContext
      tags:
        - Contexts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - description
              properties:
                title:
                  type: string
                  description: Name of the context
                description:
                  type: string
                  description: Detailed description of the context
                tags:
                  type: array
                  items:
                    type: string
                  description: Tags for categorization
                priority:
                  type: string
                  enum: [low, medium, high, critical]
                  description: Context priority level
      responses:
        201:
          description: Context created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  context_id:
                    type: string
                  title:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  status:
                    type: string

    get:
      summary: List all contexts
      description: Retrieve all contexts with optional filtering
      operationId: listContexts
      tags:
        - Contexts
      parameters:
        - name: tags
          in: query
          schema:
            type: array
            items:
              type: string
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        200:
          description: List of contexts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    context_id:
                      type: string
                    title:
                      type: string
                    description:
                      type: string
                    tags:
                      type: array
                      items:
                        type: string
                    priority:
                      type: string
                    created_at:
                      type: string
                      format: date-time
                    updated_at:
                      type: string
                      format: date-time

  /contexts/{context_id}:
    get:
      summary: Retrieve a specific context
      operationId: getContext
      tags:
        - Contexts
      parameters:
        - name: context_id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Context details
          content:
            application/json:
              schema:
                type: object
                properties:
                  context_id:
                    type: string
                  title:
                    type: string
                  description:
                    type: string
                  content:
                    type: string
                  tags:
                    type: array
                    items:
                      type: string
                  notes:
                    type: array
                    items:
                      type: object
                  decisions:
                    type: array
                    items:
                      type: object

    put:
      summary: Update a context
      operationId: updateContext
      tags:
        - Contexts
      parameters:
        - name: context_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                content:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                priority:
                  type: string
                  enum: [low, medium, high, critical]
      responses:
        200:
          description: Context updated successfully

    delete:
      summary: Delete a context
      operationId: deleteContext
      tags:
        - Contexts
      parameters:
        - name: context_id
          in: path
          required: true
          schema:
            type: string
      responses:
        204:
          description: Context deleted successfully

  /contexts/{context_id}/notes:
    post:
      summary: Add a note to context
      operationId: addNote
      tags:
        - Notes
      parameters:
        - name: context_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  description: Note content
                type:
                  type: string
                  enum: [research, action_item, decision, insight, reference]
                source:
                  type: string
                  description: Source of the note
      responses:
        201:
          description: Note added successfully

    get:
      summary: Get all notes in a context
      operationId: getNotes
      tags:
        - Notes
      parameters:
        - name: context_id
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [research, action_item, decision, insight, reference]
      responses:
        200:
          description: List of notes

  /contexts/{context_id}/decisions:
    post:
      summary: Create a decision matrix
      operationId: createDecision
      tags:
        - Decisions
      parameters:
        - name: context_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - options
              properties:
                title:
                  type: string
                  description: Decision title
                description:
                  type: string
                options:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      pros:
                        type: array
                        items:
                          type: string
                      cons:
                        type: array
                        items:
                          type: string
                      score:
                        type: number
                criteria:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      weight:
                        type: number
      responses:
        201:
          description: Decision matrix created

  /contexts/{context_id}/research:
    post:
      summary: Add research item
      operationId: addResearch
      tags:
        - Research
      parameters:
        - name: context_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - url
              properties:
                title:
                  type: string
                url:
                  type: string
                  format: uri
                summary:
                  type: string
                key_findings:
                  type: array
                  items:
                    type: string
                tags:
                  type: array
                  items:
                    type: string
      responses:
        201:
          description: Research item added

    get:
      summary: Get all research items
      operationId: getResearch
      tags:
        - Research
      parameters:
        - name: context_id
          in: path
          required: true
          schema:
            type: string
        - name: tags
          in: query
          schema:
            type: array
            items:
              type: string
      responses:
        200:
          description: List of research items

  /templates:
    get:
      summary: Get decision-making templates
      operationId: getTemplates
      tags:
        - Templates
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [business, personal, technical, strategic, financial]
      responses:
        200:
          description: List of templates
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    template_id:
                      type: string
                    name:
                      type: string
                    description:
                      type: string
                    category:
                      type: string
                    structure:
                      type: object

  /analytics/summary:
    get:
      summary: Get context analytics and summary
      operationId: getAnalytics
      tags:
        - Analytics
      parameters:
        - name: context_id
          in: query
          schema:
            type: string
        - name: time_period
          in: query
          schema:
            type: string
            enum: [day, week, month, all]
      responses:
        200:
          description: Analytics summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_contexts:
                    type: integer
                  total_notes:
                    type: integer
                  total_decisions:
                    type: integer
                  most_used_tags:
                    type: array
                    items:
                      type: string
                  recent_activity:
                    type: array

  /search:
    get:
      summary: Search across all contexts
      operationId: searchContexts
      tags:
        - Search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [context, note, decision, research]
      responses:
        200:
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    title:
                      type: string
                    type:
                      type: string
                    relevance_score:
                      type: number
                    preview:
                      type: string

  /export:
    post:
      summary: Export context to various formats
      operationId: exportContext
      tags:
        - Export
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - context_id
                - format
              properties:
                context_id:
                  type: string
                format:
                  type: string
                  enum: [pdf, markdown, json, html, docx]
                include_decisions:
                  type: boolean
                  default: true
                include_research:
                  type: boolean
                  default: true
      responses:
        200:
          description: Export successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  download_url:
                    type: string
                  format:
                    type: string
                  created_at:
                    type: string

tags:
  - name: Contexts
    description: Manage conversation contexts
  - name: Notes
    description: Manage notes and documentation
  - name: Decisions
    description: Create and manage decision matrices
  - name: Research
    description: Manage research items and citations
  - name: Templates
    description: Access decision-making templates
  - name: Analytics
    description: Get analytics and summaries
  - name: Search
    description: Search functionality
  - name: Export
    description: Export contexts and data
